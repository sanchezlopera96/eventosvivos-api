name: Imagen Docker (GHCR)

# Construye la imagen de la API y la publica en GitHub Container Registry
# para desplegarla en el cluster k3s de AWS (independiente del CD de Azure).
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # permite lanzarlo manualmente desde la pestaña Actions

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
